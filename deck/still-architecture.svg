<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B9A8F2"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2A1A66"/></marker><marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5B3CC4"/></marker>
<radialGradient id="o" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C9B8FF" stop-opacity=".8"/><stop offset="1" stop-color="#F1EDFD" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>
<circle cx="1800" cy="60" r="330" fill="url(#o)"/>
<text x="40" y="80" font-family="Arial" font-size="18" font-weight="700" fill="#5B3CC4" text-anchor="start" letter-spacing="5">ARCHITECTURE</text>
<text x="40" y="150" font-family="Arial" font-size="52" font-weight="700" fill="#1C1433" text-anchor="start">Still. — the agent, without the black box</text>
<text x="40" y="200" font-family="Arial" font-size="22" font-weight="400" fill="#6E6887" text-anchor="start">One pass per check-in. Every arrow is enforced in server code, not in a prompt.</text>
<rect x="40" y="280" width="220" height="190" rx="28" fill="#F1EDFD"/><text x="150" y="348" font-family="Arial" font-size="24" font-weight="700" fill="#2A1A66" text-anchor="middle">Trigger</text><text x="150" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">server scheduler</text><text x="150" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">or “Check in now”</text><line x1="266" y1="375" x2="304" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="310" y="280" width="220" height="190" rx="28" fill="#F1EDFD"/><text x="420" y="332" font-family="Arial" font-size="24" font-weight="700" fill="#2A1A66" text-anchor="middle">Student</text><text x="420" y="362" font-family="Arial" font-size="24" font-weight="700" fill="#2A1A66" text-anchor="middle">response</text><text x="420" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">one short answer</text><text x="420" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">never stored</text><line x1="536" y1="375" x2="574" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="580" y="280" width="220" height="190" rx="28" fill="#5B3CC4"/><text x="690" y="332" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Safety</text><text x="690" y="362" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">backstop</text><text x="690" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">78 reviewed phrases</text><text x="690" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">local · no network</text><line x1="806" y1="375" x2="844" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="850" y="280" width="220" height="190" rx="28" fill="#5B3CC4"/><text x="960" y="332" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM</text><text x="960" y="362" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">understanding</text><text x="960" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">risk + need + context</text><text x="960" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">failure → UNCERTAIN</text><line x1="1076" y1="375" x2="1114" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="1120" y="280" width="220" height="190" rx="28" fill="#5B3CC4"/><text x="1230" y="332" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Policy</text><text x="1230" y="362" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">engine</text><text x="1230" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">server table decides</text><text x="1230" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">model can't pick tools</text><line x1="1346" y1="375" x2="1384" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="1390" y="280" width="220" height="190" rx="28" fill="#5B3CC4"/><text x="1500" y="332" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Allowlisted</text><text x="1500" y="362" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">executor</text><text x="1500" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">5 fixed actions</text><text x="1500" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">server-set limits</text><line x1="1616" y1="375" x2="1654" y2="375" stroke="#B9A8F2" stroke-width="3" marker-end="url(#a)"/><rect x="1660" y="280" width="220" height="190" rx="28" fill="#F1EDFD"/><text x="1770" y="348" font-family="Arial" font-size="24" font-weight="700" fill="#2A1A66" text-anchor="middle">End</text><text x="1770" y="408" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">check-in closes</text><text x="1770" y="432" font-family="Arial" font-size="17" font-weight="400" fill="#6E6887" text-anchor="middle">no endless chat</text><rect x="1180" y="660" width="500" height="170" rx="28" fill="#2A1A66"/><text x="1430" y="710" font-family="Arial" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Human help</text><text x="1430" y="748" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">Tele-MANAS 14416 · Emergency 112 (first for danger)</text><text x="1430" y="776" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">verified static config — never model-written</text><text x="1430" y="804" font-family="Arial" font-size="17" font-weight="400" fill="#E4DCFB" text-anchor="middle">no skill runs · check-in ends</text><path d="M1265 470 V650" stroke="#2A1A66" stroke-width="3" fill="none" marker-end="url(#ad)"/><text x="1280" y="560" font-family="Arial" font-size="17" font-weight="700" fill="#2A1A66" text-anchor="start">HIGH_RISK</text><path d="M610 470 V930 H1600 V840" stroke="#2A1A66" stroke-width="3" fill="none" marker-end="url(#ad)"/><text x="1140" y="920" font-family="Arial" font-size="17" font-weight="700" fill="#2A1A66" text-anchor="middle">explicit crisis phrase → straight to help · the model is never called</text><rect x="770" y="630" width="370" height="150" rx="28" fill="#FFFFFF" stroke="#5B3CC4" stroke-width="3"/><text x="955" y="675" font-family="Arial" font-size="22" font-weight="700" fill="#5B3CC4" text-anchor="middle">One clarification</text><text x="955" y="708" font-family="Arial" font-size="17" font-weight="400" fill="#1C1433" text-anchor="middle">student taps the closest need</text><text x="955" y="734" font-family="Arial" font-size="17" font-weight="400" fill="#1C1433" text-anchor="middle">can never downgrade risk</text><text x="955" y="760" font-family="Arial" font-size="15" font-weight="400" fill="#6E6887" text-anchor="middle">(sealed hold, 15 min, not stored)</text><path d="M1180 470 L1075 626" stroke="#5B3CC4" stroke-width="3" fill="none" marker-end="url(#av)"/><text x="1150" y="592" font-family="Arial" font-size="17" font-weight="700" fill="#5B3CC4" text-anchor="start">UNCERTAIN</text><path d="M830 630 L930 474" stroke="#5B3CC4" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#av)"/><text x="626" y="585" font-family="Arial" font-size="17" font-weight="700" fill="#5B3CC4" text-anchor="start">re-check the original</text><text x="626" y="607" font-family="Arial" font-size="17" font-weight="400" fill="#5B3CC4" text-anchor="start">(safety + model again)</text><text x="1375" y="505" font-family="Arial" font-size="15" font-weight="700" fill="#5B3CC4" text-anchor="middle">SAFE</text><text x="1500" y="530" font-family="Arial" font-size="16" font-weight="400" fill="#6E6887" text-anchor="middle">Focus timer · Breathing guide · Guided reset</text><text x="1500" y="554" font-family="Arial" font-size="16" font-weight="400" fill="#6E6887" text-anchor="middle">Copy message · Acknowledge</text>
<text x="40" y="1030" font-family="Arial" font-size="34" font-weight="700" fill="#1C1433">THE MODEL <tspan fill="#5B3CC4">INTERPRETS.</tspan> THE POLICY <tspan fill="#5B3CC4">DECIDES.</tspan> THE EXECUTOR <tspan fill="#5B3CC4">ACTS.</tspan></text>
</svg>